name: CI

# CI runs the SAME checks contributors run locally via pre-commit — the
# .pre-commit-config.yaml is the single source of truth, so there is no drift
# between local hooks and CI. None of these checks need the special DestinE
# kernel or data access, so they run on a stock GitHub runner.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# NOTE: actions below are pinned by tag for readability. For a hardened
# setup, repin each to a full commit SHA (e.g. actions/checkout@<sha>).

jobs:
  pre-commit:
    name: Lint, validate & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runs every hook in .pre-commit-config.yaml against all files:
      # nbstripout (verify), ruff, nbformat-validate, gitleaks, JSON/merge
      # hygiene. A hook that modifies a file (e.g. nbstripout) fails the run
      # and shows the diff.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Advisory and network-dependent, so kept out of pre-commit and
      # non-blocking for now: requirements.txt pins ~150 deps and several have
      # known CVEs. Triage the backlog, then drop `|| true` to make it gating.
      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt || true
