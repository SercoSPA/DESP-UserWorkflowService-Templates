# Gitleaks config for the DestinE notebook tutorials repo.

title = "DestinE notebook secret scanning"

[extend]
useDefault = true

[[rules]]
id = "destine-edh-pat"
description = "Earth Data Hub personal access token (edh_pat_...)"
regex = '''edh_pat_[0-9a-fA-F]{32,}'''
keywords = ["edh_pat_"]

[[rules]]
id = "destine-edh-key"
description = "Earth Data Hub API key (edh_key_...)"
regex = '''edh_key_[A-Za-z0-9_\-]{12,}'''
keywords = ["edh_key_"]

[allowlist]
description = """
Documented example tokens reused across the EarthDataHub tutorials, treated
as teaching examples rather than live credentials.
"""
regexes = [
  '''edh_pat_44bbb7e9192a4c6bb47ddf07d07564eee5d17de8dfc48f7118f88e3bc4a4157f8fe2403f5aa0a2d53441b6922ea9a33a''',
  '''edh_key_MHOQO_Y_h4ywpaMQe4cndtydvbpU6ySBNARWprm5tgz''',
]
